server.port=8080
server.address=0.0.0.0

# =============================================================================
# 整合包默认配置
# =============================================================================
# 所有路径都相对「启动时的工作目录」。整合包约定：在项目根目录启动
# （pom.xml 所在层或有 target/ 的那一层），因此这里的相对路径可直接生效。
# 换机器或换数据时只改本文件，不需要重新编译。

# 结果文件根目录。前端切到「真实接口」模式时读取这里的产物。
footpred.local.root=data/export

# 两套算法包的 HDFS 根（部署到 Hadoop 时使用；只读模式下不会被访问）。
footpred.hdfs.root=/footpred
footpred.hdfs.root.partner=/FootPred

# 各类产物位置，相对 footpred.local.root 或绝对路径。
# 未放置对应文件时，接口返回空列表而不是报错，前端会提示「暂无数据」。
footpred.result.module2-evaluation=handoff/models/module2/club-rf-v4
# 比赛预测与球员画像的默认读取位置（相对 footpred.local.root）
footpred.result.matches=runs/prep-225732/module2/rf4-predictions-test.tsv
# Module 1 DC output is a separate 7-column format. Never use the RF file here.
# Genuine national (6) + club (5) MR predictions from the Linux replay.
# The supplied fixtures are demonstration pairings, not an upcoming schedule.
footpred.result.matches.dixon-coles=runs/dc-replay-20261030-4093cac9/partner/predictions.tsv
footpred.result.matches.dixon-coles.note=Real Hadoop MR output: 6 national-team and 5 club demonstration pairings. These are not a verified upcoming schedule; no actual results or accuracy are assigned.
footpred.result.players=runs/m3-092841/module3/players.tsv

# 八项历史分析的默认文件（前端切「真实接口」时按 analysis 自动选取）
footpred.result.history.p61=runs/m5-154913/module5/champions.tsv
footpred.result.history.p62=runs/m5-154913/module5/home-advantage.tsv
footpred.result.history.p63=runs/p63-093438-goal-minutes.tsv
footpred.result.history.p64=runs/m5-154913/module5/h2h.tsv
footpred.result.history.p65=runs/p65-194220/module5/messi_club.tsv
footpred.result.history.p66=runs/p66-160856/module5/league-style.tsv
footpred.result.history.p67=runs/p67-154719-p67.tsv
footpred.result.history.p68=runs/p68-154057/module5/nationality.tsv
# 注意：这些路径会先与 footpred.local.root 拼接，所以必须写成相对该根的路径。
# 模型在 data/models/ 下、结果根是 data/export/，因此用 ../models/ 指回。
footpred.result.module2-club-model=../models/module2/club-rf-v4
footpred.result.module2-international-model=../models/module2/international-rf-v1
footpred.result.module3-model=../models/module3/player-xg-v1/model.json
footpred.result.simulation=runs/module4-fivejobs-20261030/simulation.tsv
footpred.result.simulation-evaluation=runs/module4-fivejobs-20261030/evaluation.tsv
footpred.result.real-table=runs/module4-fivejobs-20261030/real_final_table.tsv
footpred.result.teams-by-league=handoff/models/teams_by_league.tsv

# 推理阈值。与交付模型配套，改动前先确认模型版本。
footpred.draw-margin.club=0.11
footpred.draw-margin.international=0.15

# =============================================================================
# 可选能力（默认关闭，开箱即用不需要外部依赖）
# =============================================================================
# 作业元数据与作业提交需要 MySQL + Hadoop。开启前先按 deploy/RUNBOOK.md 配置。
footpred.mysql.enabled=false
footpred.job.enabled=false
footpred.job.training.enabled=false
footpred.upload.enabled=false
footpred.upload.root=/footpred/web-uploads
footpred.cluster.mode=local
footpred.hdfs.bin=hdfs
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=65MB
footpred.job.max-concurrent=1
footpred.hadoop.bin=hadoop
footpred.jar.handoff=
footpred.jar.handoff.module3=
footpred.jar.handoff.module5=
footpred.jar.partner=

# =============================================================================
# 日志
# =============================================================================
logging.level.root=INFO
logging.level.com.footpred=INFO

# Optional dedicated five-job algorithm jar on the Hadoop execution host
footpred.jar.partner.module4=
