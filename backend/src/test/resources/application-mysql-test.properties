# H2 stands in for MySQL so the schema and SQL are exercised on every build.
# The application excludes Spring Boot's DataSource auto-configuration (so the
# database-free deployment can start), therefore the test data source is created
# explicitly here rather than by Boot.
spring.datasource.url=jdbc:h2:mem:footpred;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

footpred.mysql.enabled=true

footpred.local.root=D:/VSCodePro/footpred-handoff-fixed
footpred.result.module2-evaluation=results/module2/club-rf-v4
footpred.result.module2-club-model=models/module2/club-rf-v4
footpred.result.module2-international-model=models/module2/international-rf-v1
footpred.result.module3-model=models/module3/player-xg-v1/model.json
footpred.result.simulation=D:/VSCodePro/FootPred_hadoop_mapreduce-main/models/simulation_leagues_v1_10k.tsv
footpred.result.real-table=D:/VSCodePro/FootPred_hadoop_mapreduce-main/models/real_final_table.tsv

# Test suite runs the H2-flavoured DDL (MySQL rejects it, H2 rejects MySQL's
# COMMENT/ENGINE clauses). Same tables, same columns, same constraints.
footpred.schema.script=schema-h2.sql
